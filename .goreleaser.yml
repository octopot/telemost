version: 2

project_name: telemost

archives:
  - id: telemost
    ids:
      - telemost
      - telemostctl
    files:
      - LICENSE
    formats: [tar.gz]
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}-{{.Arch}}"

# brews is deprecated upstream, but it is the only GoReleaser generator of a
# Formula (as octopot/indexit and octomation/maintainer). Keep GoReleaser
# pinned in CI.
brews:
  - name: telemost
    ids: [telemost]
    # a prerelease tag (vX.Y.Z-rcN) leaves the tap as it is
    skip_upload: auto
    commit_author:
      use_github_app_token: true
    description: "The telemost service and its client, telemostctl."
    directory: Formula
    homepage: https://github.com/octopot/telemost
    repository:
      owner: octolab
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    install: |
      bin.install "telemost"
      bin.install "telemostctl"
      prefix.install_metafiles
    test: |
      system "#{bin}/telemost", "--help"
      system "#{bin}/telemostctl", "--help"

builds:
  - id: telemost
    binary: telemost
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    main: ./cmd/server
  - id: telemostctl
    binary: telemostctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    main: ./cmd/client

checksum: { name_template: checksums.txt }

dockers_v2:
  - id: telemost
    ids: [telemost]
    images: ['ghcr.io/octopot/telemost']
    tags:
      - '{{.Tag}}'
      - 'v{{.Major}}'
      - 'v{{.Major}}.{{.Minor}}'
      - '{{ if not .Prerelease }}latest{{ end }}'
    extra_files: [deploy/config.toml, LICENSE]
    labels:
      org.opencontainers.image.revision: '{{.FullCommit}}'
      org.opencontainers.image.created: '{{.Date}}'
      org.opencontainers.image.version: '{{.Version}}'
    platforms: [linux/amd64, linux/arm64]

release:
  # the repository comes from the git remote; a prerelease tag (vX.Y.Z-rcN)
  # is published as a prerelease, never as Latest
  prerelease: auto
